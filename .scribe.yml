site: pawling-masonry
turnstileSiteKey: 0x4AAAAAAFHtLCWg1S7IznJp
umamiWebsiteId: 2f96f4b6-71a7-4946-8f6b-2340a6361dd4
umamiScriptUrl: https://analytics.weaverdigital.io/script.js
contactCollection: inquiries
collections:
  - name: posts
    label: Posts
    path: content/posts
    format: yaml-frontmatter
    view:
      primary: title
      sort: date
    fields:
      - name: title
        type: string
        required: true
      - name: date
        type: date
        required: true
      - name: heroImage
        type: image
      - name: body
        type: rich-text
        isBody: true
  - name: inquiries
    label: Inquiries
    path: content/inquiries
    format: yaml
    form: true
    fields:
      - name: name
        type: string
        required: true
      - name: email
        type: string
        required: true
      - name: message
        type: text
        required: true
