site: pawling-masonry
environment: production
siteName: Pawling Masonry Inc
turnstileSiteKey: 0x4AAAAAAFHtLCWg1S7IznJp
umamiWebsiteId: 2f96f4b6-71a7-4946-8f6b-2340a6361dd4
umamiScriptUrl: https://analytics.weaverdigital.io/script.js
contactCollection: inquiries
collections:
  - name: services
    label: Services
    description: The four cards under "What we do" on the homepage.
    path: content/services
    format: yaml
    view:
      primary: title
      sort: order
      fields:
        - title
        - order
    fields:
      - name: title
        type: string
        label: Title
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: description
        type: text
        label: Description
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: photo
        type: image
        label: Photo
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: photoAlt
        type: string
        label: Photo description (alt text)
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: order
        type: number
        label: Order
        required: true
        hidden: false
        readonly: false
        isBody: false
    form: false
  - name: gallery
    label: Our Work
    description: Job photos in the "Our work" gallery. Normal photos sit three to a
      row; a narrow one fills half a slot, like a half brick; a wide one runs
      the full row.
    path: content/gallery
    format: yaml
    view:
      primary: caption
      sort: order
      fields:
        - caption
        - size
        - order
    fields:
      - name: caption
        type: string
        label: Caption
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: photo
        type: image
        label: Photo
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: photoAlt
        type: string
        label: Photo description (alt text)
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: size
        type: select
        label: Size
        required: false
        default: normal
        hidden: false
        readonly: false
        isBody: false
        options:
          - normal
          - narrow
          - wide
      - name: order
        type: number
        label: Order
        required: true
        hidden: false
        readonly: false
        isBody: false
    form: false
  - name: reviews
    label: Reviews
    description: Customer reviews from Google, shown under "5.0 stars on Google".
    path: content/reviews
    format: yaml
    view:
      primary: name
      sort: order
      fields:
        - name
        - job
        - order
    fields:
      - name: quote
        type: text
        label: Quote
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: name
        type: string
        label: Name (first name and last initial)
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: job
        type: string
        label: Job
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: order
        type: number
        label: Order
        required: true
        hidden: false
        readonly: false
        isBody: false
    form: false
  - name: inquiries
    label: Estimate Requests
    path: content/inquiries
    format: yaml
    form: true
    description: Estimate requests from the website form.
    workflow:
      states:
        - name: new
          label: New
          kind: needs-you
        - name: contacted
          label: Contacted
          kind: needs-you
        - name: closed
          label: Closed
          kind: closed
    notify: []
    view:
      fields:
        - name
        - contact
        - kind
        - status
        - submittedAt
      sort: submittedAt
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: contact
        label: Phone or Email
        type: string
        required: true
      - name: kind
        label: Type of work
        type: string
      - name: message
        label: About the job
        type: text
